spring.application.name=crud-rest-api
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/crud_rest_api_db
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# spring.datasource.hikari.minimum-idle=10
# spring.datasource.hikari.maximum-pool-size=50
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.client-type=lettuce
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=10s
spring.data.redis.database=0
# spring.data.redis.username=default
# spring.data.redis.password=default

management.endpoints.web.exposure.include=health
managament.endpoint.health.enabled=true
managament.endpoint.health.show-details=always
management.health.redis.enabled=true

spring.cache.type=redis
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=cache:
spring.cache.redis.cache-null-values=true
spring.cache.redis.enable-statistics=true
spring.cache.redis.time-to-live=60s